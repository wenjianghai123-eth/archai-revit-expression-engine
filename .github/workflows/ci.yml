name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Typecheck, Build, Unit Tests
    runs-on: ubuntu-latest
    env:
      AI_PROVIDER: mock
      AUTH_MODE: dev
      DATA_BACKEND: json
      FILE_STORAGE: local
      PORT: 8787
      MAX_IMAGE_MB: 10
      MAX_MODEL_MB: 50
      GENERATION_JOB_RATE_LIMIT_PER_MINUTE: 100
      CORS_ORIGIN: http://127.0.0.1:3000,http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test

  e2e:
    name: Optional E2E
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    env:
      AI_PROVIDER: mock
      AUTH_MODE: dev
      DATA_BACKEND: json
      FILE_STORAGE: local
      PORT: 8787
      MAX_IMAGE_MB: 10
      MAX_MODEL_MB: 50
      GENERATION_JOB_RATE_LIMIT_PER_MINUTE: 100
      CORS_ORIGIN: http://127.0.0.1:3000,http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Edge
        run: npx playwright install --with-deps msedge

      - name: Playwright E2E
        run: npm run test:e2e

